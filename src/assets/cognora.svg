<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cog" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a051b"/>
      <stop offset="50%" stop-color="#150a30"/>
      <stop offset="100%" stop-color="#210d49"/>
    </linearGradient>
    <linearGradient id="neon-cog" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="50%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="node-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="100%" stop-color="#4f46e5"/>
    </linearGradient>
    <filter id="glow-cog" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-cog)" rx="24"/>

  <!-- Neural Mesh Grid -->
  <g stroke="#8b5cf6" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Main Window Outer Frame -->
  <rect x="60" y="55" width="680" height="390" rx="16" fill="#0f0926" stroke="#8b5cf6" stroke-width="2" opacity="0.95"/>
  <rect x="60" y="55" width="680" height="42" rx="16" fill="#180e3d"/>
  <circle cx="90" cy="76" r="5" fill="#ff5f56"/>
  <circle cx="108" cy="76" r="5" fill="#ffbd2e"/>
  <circle cx="126" cy="76" r="5" fill="#27c93f"/>
  <text x="400" y="81" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">COGNORA // AI STUDY ASSISTANT &amp; KNOWLEDGE ENGINE</text>

  <!-- Left Sidebar Panel -->
  <rect x="80" y="115" width="160" height="310" rx="10" fill="#140b33" stroke="#2e1a66" stroke-width="1.5"/>
  <text x="100" y="145" fill="#a78bfa" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" letter-spacing="1">LEARNING MODULES</text>
  
  <rect x="95" y="160" width="130" height="32" rx="6" fill="#8b5cf6" opacity="0.25"/>
  <text x="110" y="180" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="600">✦ Study Roadmap</text>

  <rect x="95" y="200" width="130" height="32" rx="6" fill="#20114f"/>
  <text x="110" y="220" fill="#94a3b8" font-family="system-ui" font-size="11">◈ Lecture Digest</text>

  <rect x="95" y="240" width="130" height="32" rx="6" fill="#20114f"/>
  <text x="110" y="260" fill="#94a3b8" font-family="system-ui" font-size="11">⚡ Knowledge Radar</text>

  <rect x="95" y="280" width="130" height="32" rx="6" fill="#20114f"/>
  <text x="110" y="300" fill="#94a3b8" font-family="system-ui" font-size="11">? Adaptive Quizzes</text>

  <!-- Mastery Gauge in Sidebar Bottom -->
  <rect x="95" y="340" width="130" height="65" rx="8" fill="#1b0e45" stroke="#8b5cf6" stroke-width="1"/>
  <text x="160" y="362" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">MASTERY SCORE</text>
  <text x="160" y="390" text-anchor="middle" fill="#00ffcc" font-family="system-ui" font-size="20" font-weight="bold">94.8%</text>

  <!-- Center Concept Graph -->
  <g stroke="#8b5cf6" stroke-width="2" opacity="0.6">
    <line x1="330" y1="210" x2="420" y2="160"/>
    <line x1="330" y1="210" x2="420" y2="270"/>
    <line x1="420" y1="160" x2="520" y2="190"/>
    <line x1="420" y1="270" x2="520" y2="240"/>
    <line x1="520" y1="190" x2="520" y2="240"/>
  </g>

  <!-- Graph Nodes -->
  <circle cx="330" cy="210" r="28" fill="url(#node-grad)" filter="url(#glow-cog)"/>
  <text x="330" y="214" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="bold">Core AI</text>

  <circle cx="420" cy="160" r="24" fill="#1e104a" stroke="#00ffcc" stroke-width="2"/>
  <text x="420" y="164" text-anchor="middle" fill="#00ffcc" font-family="system-ui" font-size="9" font-weight="bold">Neural Net</text>

  <circle cx="420" cy="270" r="24" fill="#1e104a" stroke="#ec4899" stroke-width="2"/>
  <text x="420" y="274" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="9" font-weight="bold">LLM RAG</text>

  <circle cx="520" cy="190" r="22" fill="#1e104a" stroke="#a78bfa" stroke-width="2"/>
  <text x="520" y="194" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="9" font-weight="bold">Vectors</text>

  <circle cx="520" cy="240" r="22" fill="#1e104a" stroke="#38bdf8" stroke-width="2"/>
  <text x="520" y="244" text-anchor="middle" fill="#38bdf8" font-family="system-ui" font-size="9" font-weight="bold">Agents</text>

  <!-- Right AI Interaction Card -->
  <rect x="560" y="115" width="160" height="310" rx="10" fill="#140b33" stroke="#2e1a66" stroke-width="1.5"/>
  <rect x="575" y="130" width="130" height="24" rx="4" fill="#20114f"/>
  <text x="640" y="146" text-anchor="middle" fill="#c084fc" font-family="monospace" font-size="10" font-weight="bold">COGNORA AGENT</text>

  <!-- Chat Bubble 1 -->
  <rect x="575" y="170" width="130" height="75" rx="8" fill="#1e104a" stroke="#8b5cf6" stroke-width="1"/>
  <text x="585" y="190" fill="#e2e8f0" font-family="system-ui" font-size="9" font-weight="bold">Lecture Synthesized:</text>
  <text x="585" y="206" fill="#94a3b8" font-family="system-ui" font-size="8">5 Key concepts mapped</text>
  <text x="585" y="220" fill="#94a3b8" font-family="system-ui" font-size="8">3 Knowledge gaps noted</text>
  <text x="585" y="234" fill="#00ffcc" font-family="system-ui" font-size="8">Quiz ready (10 items)</text>

  <!-- Chat Bubble 2 -->
  <rect x="575" y="260" width="130" height="55" rx="8" fill="#2a1668"/>
  <text x="585" y="280" fill="#ffffff" font-family="system-ui" font-size="9">Ask a doubt...</text>
  <line x1="585" y1="298" x2="685" y2="298" stroke="#4c2c96" stroke-width="1"/>

  <!-- Action Button -->
  <rect x="575" y="340" width="130" height="36" rx="6" fill="#8b5cf6"/>
  <text x="640" y="362" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="bold">Start Revision</text>

  <!-- Title Bottom Bar -->
  <text x="400" y="475" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" letter-spacing="4">COGNORA AI</text>
</svg>

