<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-cx" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#021424"/>
      <stop offset="50%" stop-color="#062238"/>
      <stop offset="100%" stop-color="#0e1838"/>
    </linearGradient>
    <linearGradient id="neon-cx" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>
    <filter id="glow-cx" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-cx)" rx="24"/>

  <!-- Subtle Blueprint Grid -->
  <g stroke="#00f2fe" stroke-opacity="0.06" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Converter Dashboard Outer Frame -->
  <rect x="70" y="60" width="660" height="380" rx="16" fill="#04172a" stroke="#00f2fe" stroke-width="2" opacity="0.95"/>
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#0a2540"/>
  <circle cx="100" cy="81" r="5" fill="#ff5f56"/>
  <circle cx="118" cy="81" r="5" fill="#ffbd2e"/>
  <circle cx="136" cy="81" r="5" fill="#27c93f"/>
  <text x="400" y="86" text-anchor="middle" fill="#00f2fe" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">INTELLIGENT FILE CONVERSION ENGINE</text>

  <!-- Left File Card (Source) -->
  <rect x="130" y="150" width="180" height="220" rx="12" fill="#082945" stroke="#4facfe" stroke-width="2"/>
  <rect x="155" y="180" width="60" height="24" rx="4" fill="#ef4444"/>
  <text x="185" y="196" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">PDF</text>
  <rect x="155" y="225" width="130" height="10" rx="4" fill="#38bdf8" opacity="0.4"/>
  <rect x="155" y="245" width="110" height="10" rx="4" fill="#38bdf8" opacity="0.4"/>
  <rect x="155" y="265" width="120" height="10" rx="4" fill="#38bdf8" opacity="0.4"/>
  <text x="220" y="330" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="12">Document.pdf</text>

  <!-- Center Transformation Arrow & Particle Nodes -->
  <circle cx="400" cy="260" r="38" fill="#04172a" stroke="#00f2fe" stroke-width="3" filter="url(#glow-cx)"/>
  <path d="M 388 260 L 405 248 L 405 255 L 418 255 L 418 265 L 405 265 L 405 272 Z" fill="#00f2fe"/>
  <path d="M 315 260 L 355 260" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4"/>
  <path d="M 445 260 L 485 260" stroke="#00f2fe" stroke-width="2" stroke-dasharray="4 4"/>

  <!-- Right File Card (Target) -->
  <rect x="490" y="150" width="180" height="220" rx="12" fill="#082945" stroke="#00f2fe" stroke-width="2" filter="url(#glow-cx)"/>
  <rect x="515" y="180" width="60" height="24" rx="4" fill="#3b82f6"/>
  <text x="545" y="196" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="12" font-weight="bold">DOCX</text>
  <rect x="515" y="225" width="130" height="10" rx="4" fill="#00f2fe" opacity="0.7"/>
  <rect x="515" y="245" width="110" height="10" rx="4" fill="#00f2fe" opacity="0.7"/>
  <rect x="515" y="265" width="120" height="10" rx="4" fill="#00f2fe" opacity="0.7"/>
  <text x="580" y="330" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="12" font-weight="bold">Converted.docx</text>

  <!-- Title Bottom Bar -->
  <text x="400" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" letter-spacing="4">ConvertX</text>
</svg>