<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d0824"/>
      <stop offset="50%" stop-color="#151030"/>
      <stop offset="100%" stop-color="#210d41"/>
    </linearGradient>
    <linearGradient id="neon1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#00cea8"/>
    </linearGradient>
    <filter id="glow1" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg1)" rx="24"/>
  <circle cx="700" cy="80" r="140" fill="#915EFF" opacity="0.15" filter="url(#glow1)"/>
  <circle cx="100" cy="420" r="160" fill="#00cea8" opacity="0.1" filter="url(#glow1)"/>
  
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Mockup UI Card -->
  <rect x="80" y="70" width="640" height="360" rx="16" fill="#1b143d" stroke="url(#neon1)" stroke-width="2" opacity="0.95"/>
  <rect x="80" y="70" width="640" height="44" rx="16" fill="#241b52"/>
  <circle cx="110" cy="92" r="6" fill="#ff5f56"/>
  <circle cx="130" cy="92" r="6" fill="#ffbd2e"/>
  <circle cx="150" cy="92" r="6" fill="#27c93f"/>

  <!-- Content Graphic -->
  <path d="M 220 280 L 300 210 L 460 210 L 540 280 L 590 285 C 610 285 620 300 610 320 L 590 340 L 190 340 L 175 315 C 170 300 180 285 200 285 Z" fill="none" stroke="url(#neon1)" stroke-width="4" filter="url(#glow1)"/>
  <circle cx="260" cy="340" r="32" fill="#151030" stroke="#00cea8" stroke-width="4"/>
  <circle cx="520" cy="340" r="32" fill="#151030" stroke="#00cea8" stroke-width="4"/>
  <circle cx="260" cy="340" r="14" fill="#915EFF"/>
  <circle cx="520" cy="340" r="14" fill="#915EFF"/>

  <!-- Text -->
  <text x="400" y="170" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">CAR RENTAL PLATFORM</text>
  <text x="400" y="405" text-anchor="middle" fill="#aaa6c3" font-family="system-ui, sans-serif" font-size="16">React • Tailwind CSS • MongoDB</text>
</svg>
