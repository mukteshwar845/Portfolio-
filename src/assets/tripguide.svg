<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a1a24"/>
      <stop offset="50%" stop-color="#082f38"/>
      <stop offset="100%" stop-color="#0c1d2e"/>
    </linearGradient>
    <linearGradient id="neon3" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow3" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="800" height="500" fill="url(#bg3)" rx="24"/>
  <circle cx="700" cy="100" r="140" fill="#2dd4bf" opacity="0.12" filter="url(#glow3)"/>
  <circle cx="100" cy="400" r="160" fill="#38bdf8" opacity="0.12" filter="url(#glow3)"/>
  
  <!-- Grid overlay -->
  <g stroke="#ffffff" stroke-opacity="0.05" stroke-width="1">
    <line x1="0" y1="100" x2="800" y2="100"/>
    <line x1="0" y1="200" x2="800" y2="200"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Mockup UI Card -->
  <rect x="80" y="70" width="640" height="360" rx="16" fill="#082026" stroke="url(#neon3)" stroke-width="2" opacity="0.95"/>
  <rect x="80" y="70" width="640" height="44" rx="16" fill="#0e343d"/>
  <circle cx="110" cy="92" r="6" fill="#ff5f56"/>
  <circle cx="130" cy="92" r="6" fill="#ffbd2e"/>
  <circle cx="150" cy="92" r="6" fill="#27c93f"/>

  <!-- Travel / Compass graphic -->
  <circle cx="400" cy="210" r="60" fill="none" stroke="url(#neon3)" stroke-width="4" filter="url(#glow3)"/>
  <circle cx="400" cy="210" r="45" fill="none" stroke="#2dd4bf" stroke-dasharray="6 6" stroke-width="2"/>
  <polygon points="400,165 412,210 400,202 388,210" fill="#2dd4bf"/>
  <polygon points="400,255 412,210 400,202 388,210" fill="#38bdf8"/>

  <!-- Text -->
  <text x="400" y="340" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="28" font-weight="bold" letter-spacing="2">TRAVEL GUIDE PLATFORM</text>
  <text x="400" y="380" text-anchor="middle" fill="#5eead4" font-family="system-ui, sans-serif" font-size="16">Next.js • Supabase • Interactive Maps</text>
</svg>
