<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-sd" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050814"/>
      <stop offset="50%" stop-color="#0b112c"/>
      <stop offset="100%" stop-color="#14092b"/>
    </linearGradient>
    <linearGradient id="accent-sd" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00ffcc"/>
      <stop offset="50%" stop-color="#915EFF"/>
      <stop offset="100%" stop-color="#ff007f"/>
    </linearGradient>
    <filter id="glow-sd" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-sd)" rx="24"/>

  <!-- Tactical Grid -->
  <g stroke="#00ffcc" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Command Window Outer Frame -->
  <rect x="70" y="60" width="660" height="380" rx="16" fill="#070c1e" stroke="#915EFF" stroke-width="2" opacity="0.95"/>
  <rect x="70" y="60" width="660" height="42" rx="16" fill="#0f1738"/>
  <circle cx="100" cy="81" r="5" fill="#ff5f56"/>
  <circle cx="118" cy="81" r="5" fill="#ffbd2e"/>
  <circle cx="136" cy="81" r="5" fill="#27c93f"/>
  <text x="400" y="86" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="13" font-weight="bold" letter-spacing="3">TACTICAL SURVEILLANCE MATRIX // 60 FPS AI</text>

  <!-- 3x3 Camera Grid Mockup -->
  <g fill="#0b132b" stroke="#1d2d50" stroke-width="1.5">
    <!-- Row 1 -->
    <rect x="90" y="115" width="195" height="95" rx="8"/>
    <rect x="302" y="115" width="195" height="95" rx="8"/>
    <rect x="515" y="115" width="195" height="95" rx="8"/>
    <!-- Row 2 -->
    <rect x="90" y="220" width="195" height="95" rx="8"/>
    <rect x="302" y="220" width="195" height="95" rx="8" stroke="#00ffcc" stroke-width="2"/>
    <rect x="515" y="220" width="195" height="95" rx="8"/>
    <!-- Row 3 -->
    <rect x="90" y="325" width="195" height="95" rx="8"/>
    <rect x="302" y="325" width="195" height="95" rx="8"/>
    <rect x="515" y="325" width="195" height="95" rx="8"/>
  </g>

  <!-- AI Target Detection Reticle in Center Channel -->
  <rect x="345" y="235" width="110" height="65" rx="4" fill="none" stroke="#00ffcc" stroke-width="2" stroke-dasharray="8 4" filter="url(#glow-sd)"/>
  <text x="400" y="260" text-anchor="middle" fill="#00ffcc" font-family="monospace" font-size="10" font-weight="bold">TARGET ACQUIRED</text>
  <text x="400" y="278" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="9">ANPR: DL 01 AB 1234</text>
  <circle cx="345" cy="235" r="3" fill="#ff007f"/>
  <circle cx="455" cy="235" r="3" fill="#ff007f"/>
  <circle cx="345" cy="300" r="3" fill="#ff007f"/>
  <circle cx="455" cy="300" r="3" fill="#ff007f"/>

  <!-- Live Status & Badges -->
  <rect x="525" y="125" width="60" height="18" rx="4" fill="#ff0055" opacity="0.8"/>
  <text x="555" y="138" text-anchor="middle" fill="#ffffff" font-family="monospace" font-size="10" font-weight="bold">● LIVE</text>
  <text x="105" y="138" fill="#a0aec0" font-family="monospace" font-size="10">CH-01 // ENTRY</text>
  <text x="317" y="138" fill="#a0aec0" font-family="monospace" font-size="10">CH-02 // PERIMETER</text>
  <text x="105" y="243" fill="#a0aec0" font-family="monospace" font-size="10">CH-04 // GATEWAY</text>

  <!-- Title Bottom Bar -->
  <text x="400" y="470" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="20" font-weight="bold" letter-spacing="4">SEEMADRISHTI</text>
</svg>