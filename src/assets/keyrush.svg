<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="bg-kr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050a1f"/>
      <stop offset="50%" stop-color="#14062a"/>
      <stop offset="100%" stop-color="#240533"/>
    </linearGradient>
    <linearGradient id="neon-kr" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f72585"/>
      <stop offset="50%" stop-color="#7209b7"/>
      <stop offset="100%" stop-color="#4cc9f0"/>
    </linearGradient>
    <filter id="glow-kr" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <rect width="800" height="500" fill="url(#bg-kr)" rx="24"/>

  <!-- Perspective Racing Track Lines -->
  <g stroke="url(#neon-kr)" stroke-width="2" opacity="0.6" filter="url(#glow-kr)">
    <line x1="400" y1="160" x2="50" y2="440"/>
    <line x1="400" y1="160" x2="200" y2="440"/>
    <line x1="400" y1="160" x2="350" y2="440"/>
    <line x1="400" y1="160" x2="450" y2="440"/>
    <line x1="400" y1="160" x2="600" y2="440"/>
    <line x1="400" y1="160" x2="750" y2="440"/>
    <!-- Horizon lines -->
    <line x1="280" y1="210" x2="520" y2="210"/>
    <line x1="220" y1="260" x2="580" y2="260"/>
    <line x1="150" y1="320" x2="650" y2="320"/>
    <line x1="80" y1="390" x2="720" y2="390"/>
  </g>

  <!-- Cyber Horizon Sun -->
  <circle cx="400" cy="160" r="45" fill="none" stroke="#f72585" stroke-width="3" filter="url(#glow-kr)"/>
  <circle cx="400" cy="160" r="30" fill="#7209b7" opacity="0.5"/>

  <!-- HUD Speedometer & Stats Card -->
  <rect x="70" y="50" width="660" height="70" rx="14" fill="#0b0e24" stroke="#4cc9f0" stroke-width="1.5" opacity="0.95"/>
  <text x="130" y="85" text-anchor="middle" fill="#4cc9f0" font-family="monospace" font-size="24" font-weight="bold">128 WPM</text>
  <text x="130" y="105" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">TYPING SPEED</text>

  <text x="400" y="85" text-anchor="middle" fill="#f72585" font-family="system-ui" font-size="20" font-weight="bold" letter-spacing="3">KEYRUSH 3D</text>
  <text x="400" y="105" text-anchor="middle" fill="#a855f7" font-family="monospace" font-size="12">SPEEDWAY // REAL-TIME 3D RACING</text>

  <text x="660" y="85" text-anchor="middle" fill="#22c55e" font-family="monospace" font-size="24" font-weight="bold">99.4%</text>
  <text x="660" y="105" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="11">ACCURACY</text>

  <!-- Cyber Racer Silhouette -->
  <polygon points="400,290 340,380 460,380" fill="#1e1035" stroke="#4cc9f0" stroke-width="2"/>
  <polygon points="400,310 365,370 435,370" fill="#f72585" opacity="0.8"/>
  <circle cx="360" cy="385" r="10" fill="#00ffff" filter="url(#glow-kr)"/>
  <circle cx="440" cy="385" r="10" fill="#00ffff" filter="url(#glow-kr)"/>

  <!-- Footer Tagline -->
  <text x="400" y="475" text-anchor="middle" fill="#ffffff" font-family="system-ui, sans-serif" font-size="15" letter-spacing="2">3D RACING TYPING GAME • THREE.JS • WEBGL</text>
</svg>