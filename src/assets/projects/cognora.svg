<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="cog-radial" cx="50%" cy="30%" r="80%">
      <stop offset="0%" stop-color="#1e1045"/>
      <stop offset="50%" stop-color="#0c0721"/>
      <stop offset="100%" stop-color="#04020a"/>
    </radialGradient>

    <!-- Glowing Linear Accents -->
    <linearGradient id="cog-neon" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea"/>
      <stop offset="50%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>

    <linearGradient id="cog-card" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1a103c" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#0e0824" stop-opacity="0.95"/>
    </linearGradient>

    <filter id="cog-blur" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="500" fill="url(#cog-radial)" rx="20"/>

  <!-- Ambient Light Orbs -->
  <circle cx="200" cy="120" r="140" fill="#9333ea" opacity="0.15" filter="url(#cog-blur)"/>
  <circle cx="620" cy="280" r="160" fill="#06b6d4" opacity="0.12" filter="url(#cog-blur)"/>

  <!-- Digital Perspective Grid -->
  <g stroke="#6366f1" stroke-opacity="0.07" stroke-width="1">
    <line x1="0" y1="80" x2="800" y2="80"/>
    <line x1="0" y1="160" x2="800" y2="160"/>
    <line x1="0" y1="240" x2="800" y2="240"/>
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="400" x2="800" y2="400"/>
    <line x1="160" y1="0" x2="160" y2="500"/>
    <line x1="320" y1="0" x2="320" y2="500"/>
    <line x1="480" y1="0" x2="480" y2="500"/>
    <line x1="640" y1="0" x2="640" y2="500"/>
  </g>

  <!-- Main Application Glass Container -->
  <rect x="50" y="45" width="700" height="410" rx="16" fill="url(#cog-card)" stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4"/>

  <!-- Window Header Bar -->
  <rect x="50" y="45" width="700" height="42" rx="16" fill="#130b2c" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.2"/>
  <circle cx="78" cy="66" r="5" fill="#ef4444"/>
  <circle cx="96" cy="66" r="5" fill="#f59e0b"/>
  <circle cx="114" cy="66" r="5" fill="#10b981"/>

  <text x="400" y="71" text-anchor="middle" fill="#c4b5fd" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="700" letter-spacing="2">COGNORA AI // ADAPTIVE STUDY WORKSPACE &amp; KNOWLEDGE ENGINE</text>

  <!-- Left Sidebar (Module Index) -->
  <rect x="68" y="102" width="160" height="336" rx="10" fill="#0d0722" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>
  <text x="84" y="128" fill="#a78bfa" font-family="system-ui" font-size="10" font-weight="800" letter-spacing="1.5">LEARNING MODULES</text>

  <!-- Nav Items -->
  <rect x="80" y="142" width="136" height="32" rx="6" fill="#9333ea" fill-opacity="0.25" stroke="#9333ea" stroke-width="1"/>
  <circle cx="94" cy="158" r="3" fill="#a855f7"/>
  <text x="106" y="162" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="600">Study Roadmap</text>

  <rect x="80" y="182" width="136" height="30" rx="6" fill="#170f38" fill-opacity="0.6"/>
  <text x="96" y="201" fill="#94a3b8" font-family="system-ui" font-size="11">◈ Lecture Digest</text>

  <rect x="80" y="220" width="136" height="30" rx="6" fill="#170f38" fill-opacity="0.6"/>
  <text x="96" y="239" fill="#94a3b8" font-family="system-ui" font-size="11">⚡ Knowledge Radar</text>

  <rect x="80" y="258" width="136" height="30" rx="6" fill="#170f38" fill-opacity="0.6"/>
  <text x="96" y="277" fill="#94a3b8" font-family="system-ui" font-size="11">? Adaptive Quizzes</text>

  <!-- Mastery Widget -->
  <rect x="80" y="305" width="136" height="115" rx="8" fill="#120930" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="148" y="328" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="10" font-weight="700">RETENTION RATE</text>
  <text x="148" y="362" text-anchor="middle" fill="#00ffcc" font-family="system-ui" font-size="26" font-weight="900" filter="url(#soft-glow)">96.4%</text>
  <rect x="94" y="378" width="108" height="6" rx="3" fill="#1e1045"/>
  <rect x="94" y="378" width="104" height="6" rx="3" fill="url(#cog-neon)"/>
  <text x="148" y="404" text-anchor="middle" fill="#94a3b8" font-family="system-ui" font-size="9">38 Concepts Mastered</text>

  <!-- Center Holographic Knowledge Graph -->
  <g stroke="#8b5cf6" stroke-width="1.5" stroke-opacity="0.4">
    <line x1="320" y1="210" x2="390" y2="155"/>
    <line x1="320" y1="210" x2="390" y2="275"/>
    <line x1="390" y1="155" x2="480" y2="185"/>
    <line x1="390" y1="275" x2="480" y2="245"/>
    <line x1="480" y1="185" x2="480" y2="245"/>
    <line x1="320" y1="210" x2="480" y2="215"/>
  </g>

  <!-- Interactive Nodes -->
  <circle cx="320" cy="210" r="32" fill="#7e22ce" filter="url(#soft-glow)"/>
  <circle cx="320" cy="210" r="28" fill="#180e3d" stroke="#a855f7" stroke-width="2"/>
  <text x="320" y="214" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="800">Core AI</text>

  <circle cx="390" cy="155" r="24" fill="#130b2c" stroke="#06b6d4" stroke-width="2" filter="url(#soft-glow)"/>
  <text x="390" y="159" text-anchor="middle" fill="#06b6d4" font-family="system-ui" font-size="9" font-weight="700">Neural Net</text>

  <circle cx="390" cy="275" r="24" fill="#130b2c" stroke="#ec4899" stroke-width="2" filter="url(#soft-glow)"/>
  <text x="390" y="279" text-anchor="middle" fill="#ec4899" font-family="system-ui" font-size="9" font-weight="700">LLM RAG</text>

  <circle cx="480" cy="185" r="22" fill="#130b2c" stroke="#a78bfa" stroke-width="2"/>
  <text x="480" y="189" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="8.5" font-weight="700">Vectors</text>

  <circle cx="480" cy="245" r="22" fill="#130b2c" stroke="#3b82f6" stroke-width="2"/>
  <text x="480" y="249" text-anchor="middle" fill="#3b82f6" font-family="system-ui" font-size="8.5" font-weight="700">Agents</text>

  <!-- Floating Concept Pill -->
  <rect x="330" y="340" width="160" height="32" rx="16" fill="#170f38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.4"/>
  <circle cx="346" cy="356" r="4" fill="#00ffcc"/>
  <text x="415" y="360" text-anchor="middle" fill="#e2e8f0" font-family="system-ui" font-size="10" font-weight="600">Active Syllabus: AI Systems</text>

  <!-- Right AI Assistant Panel -->
  <rect x="540" y="102" width="192" height="336" rx="10" fill="#0d0722" stroke="#ffffff" stroke-width="1" stroke-opacity="0.06"/>

  <rect x="552" y="116" width="168" height="26" rx="6" fill="#1e1045"/>
  <circle cx="566" cy="129" r="3.5" fill="#00ffcc" filter="url(#soft-glow)"/>
  <text x="638" y="133" text-anchor="middle" fill="#c4b5fd" font-family="system-ui" font-size="10" font-weight="700">AI TUTOR INSIGHTS</text>

  <!-- Chat / Digest Card -->
  <rect x="552" y="152" width="168" height="110" rx="8" fill="#170d38" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.3"/>
  <text x="564" y="172" fill="#ffffff" font-family="system-ui" font-size="10" font-weight="700">Lecture Synthesized:</text>
  <text x="564" y="190" fill="#94a3b8" font-family="system-ui" font-size="9">✓ 5 Core theorems mapped</text>
  <text x="564" y="206" fill="#94a3b8" font-family="system-ui" font-size="9">✓ 3 Knowledge gaps resolved</text>
  <text x="564" y="222" fill="#00ffcc" font-family="system-ui" font-size="9">✓ 10 Practice prompts ready</text>
  <text x="564" y="246" fill="#ec4899" font-family="system-ui" font-size="9" font-weight="600">● 1 Review item remaining</text>

  <!-- Prompt Box -->
  <rect x="552" y="274" width="168" height="70" rx="8" fill="#12092e" stroke="#ffffff" stroke-width="1" stroke-opacity="0.08"/>
  <text x="564" y="294" fill="#a78bfa" font-family="system-ui" font-size="9" font-weight="600">Personalized Practice</text>
  <text x="564" y="312" fill="#64748b" font-family="system-ui" font-size="8.5">"Explain backpropagation with...</text>
  <text x="564" y="330" fill="#38bdf8" font-family="system-ui" font-size="9">Ask follow-up doubt →</text>

  <!-- Action Button -->
  <rect x="552" y="358" width="168" height="38" rx="8" fill="url(#cog-neon)" filter="url(#soft-glow)"/>
  <text x="636" y="382" text-anchor="middle" fill="#ffffff" font-family="system-ui" font-size="11" font-weight="800" letter-spacing="0.5">LAUNCH SMART QUIZ</text>

  <!-- Status Bottom Bar -->
  <text x="400" y="482" text-anchor="middle" fill="#a78bfa" font-family="system-ui" font-size="11" font-weight="600" letter-spacing="3">COGNORA AI // PERSONALIZED LEARNING SUITE</text>
</svg>
